server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Holding page: the HTML is the whole site and will change whenever we
    # revisit the domain, so keep it on a short leash.
    #
    # NOTE: `expires` only, deliberately. An `add_header` here would suppress
    # inheritance of the server-level add_header directives below for this
    # location — and because `index index.html` makes a request for "/"
    # internally redirect to /index.html and re-run location matching, that
    # silently stripped the security headers from the only page on the site.
    # `expires` is not an add_header, so inheritance survives.
    location = /index.html {
        expires 5m;
    }

    # Fingerprinted assets. Same rule: `expires` only, no add_header.
    location /static/ {
        expires 1y;
    }

    # Vanity redirect. Brandable enough to print on a sticker or put on a video
    # end-card, countable in our own access log, and one line to change if the
    # channel handle ever moves. 302 not 301 so it stays fixable, and noindex
    # so it never becomes a URL in its own right.
    location = /subscribe {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://www.youtube.com/@motoproponent?sub_confirmation=1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Sensible defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # LOAD-BEARING — do not tighten to "no-referrer".
    # YouTube Studio attributes external traffic by the Referer header, not by
    # URL parameters. This policy is what makes visits from here show up as
    # "External -> motoproponent.com" in the channel's traffic sources. Set it
    # to no-referrer and that attribution silently disappears. For the same
    # reason, links to YouTube must not carry rel="noreferrer".
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Belt-and-braces alongside the robots meta tag, and it covers non-HTML
    # responses the meta tag cannot reach. Remove this at the same time as the
    # meta tag when the real site ships — see site/robots.txt for the ordering.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/html text/css image/svg+xml application/javascript
               application/xml application/json text/plain;
}
