server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Holding page: the HTML is the whole site and will change whenever we
    # revisit the domain, so keep it on a short leash.
    location = /index.html {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Sensible defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/html text/css image/svg+xml application/javascript;
}
