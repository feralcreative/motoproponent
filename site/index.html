<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Motoproponent</title>
  <meta name="description" content="Motoproponent — something is being built here." />

  <!-- Holding page: keep it out of the index until there is something worth
         indexing. Note the ordering trap — robots.txt says "Allow: /" on purpose.
         Blocking the crawl would stop Google from ever READING this noindex,
         which is how a bare, snippet-less URL ends up stuck in the index.
         Crawlable + noindex is the configuration that actually keeps you out.
         When the real site ships, remove this tag AND the X-Robots-Tag header in
         nginx.conf AND add the Sitemap: line to robots.txt, in one deploy. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Self-referencing. Must exist before the first UTM-tagged inbound link
         does, or /?utm_source=youtube becomes a crawlable duplicate of /. -->
  <link rel="canonical" href="https://motoproponent.com/" />

  <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Motoproponent" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Motoproponent" />
  <meta property="og:description" content="Something is being built here." />
  <meta property="og:url" content="https://motoproponent.com/" />
  <meta property="og:image" content="https://motoproponent.com/static/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Motoproponent" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Motoproponent" />
  <meta name="twitter:description" content="Something is being built here." />
  <meta name="twitter:image" content="https://motoproponent.com/static/og.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314110E'/%3E%3Cpath d='M8 23 L24 9' stroke='%23C8452F' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3YRCXQL242"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-3YRCXQL242');
  </script>

  <style>
    :root {
      --bg: #faf8f5;
      --ink: #14110e;
      --accent: #c8452f;
      --muted: #8e8880;
      --rule: #d8d3cb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110e;
        --ink: #f4f1ec;
        --accent: #e0563d;
        --muted: #8a837a;
        --rule: #2e2a25;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 54rem;
    }

    /* The composition is deliberately 180°-rotationally symmetric — equal rules
         above and below, a centred diagonal that maps onto itself when rotated.
         A quiet nod to the ambigram work without leaning on the unfinished mark. */
    .rule {
      height: 1px;
      background: var(--rule);
      border: 0;
      margin: 0;
      /* Full width of <main>, which is also the wordmark SVG's width — so the
           rules bracket the wordmark exactly at every viewport size. */
      width: 100%;
    }

    /* The wordmark is SVG text rather than styled HTML so that a 13-character
         word can never overflow a narrow viewport. textLength pins it to the
         full box width and lengthAdjust="spacing" absorbs the difference in the
         tracking alone, leaving the glyphs undistorted. It also means the rules
         above and below align with the wordmark by construction. */
    .wordmark {
      margin: clamp(1.5rem, 4vw, 2.5rem) 0;
      font-size: 0;
      /* kill the inline-element baseline gap */
    }

    .wordmark svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .wordmark text {
      fill: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 88px;
    }

    .diagonal {
      display: none;
      margin: clamp(1.75rem, 5vw, 3rem) auto;
      width: 2.5rem;
      height: 2.5rem;
      overflow: visible;
    }

    .diagonal line {
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .statement {
      margin: 0;
      font-size: clamp(0.95rem, 1.6vw, 1.125rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--ink);
      padding-top: 3em;
    }

    .cta {
      margin: clamp(1.5rem, 4vw, 2.25rem) 0 0;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .cta a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.25em;
      transition: opacity 0.15s ease;
    }

    .cta a:hover,
    .cta a:focus-visible {
      opacity: 0.7;
    }

    footer {
      margin-top: clamp(3rem, 9vw, 5.5rem);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: no-preference) {

      main,
      footer {
        animation: rise 0.6s ease-out both;
      }

      footer {
        animation-delay: 0.15s;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.5rem);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }
    }
  </style>
</head>

<body>
  <main>
    <hr class="rule" />
    <h1 class="wordmark">
      <svg viewBox="0 0 1000 112" role="img" aria-label="Motoproponent">
        <title>Motoproponent</title>
        <text x="0" y="88" textLength="1000" lengthAdjust="spacing">MOTOPROPONENT</text>
      </svg>
    </h1>
    <hr class="rule" />

    <svg class="diagonal" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <line x1="7" y1="33" x2="33" y2="7" />
    </svg>

    <p class="statement">Something is being built here.</p>

    <!-- rel="noopener" only. Do NOT add rel="noreferrer" — it strips the
           Referer header, and that header is the only thing that makes these
           visits show up as "External -> motoproponent.com" in YouTube Studio.
           Same reason nginx.conf keeps Referrer-Policy permissive. -->
    <p class="cta">
      <a href="https://www.youtube.com/@motoproponent" target="_blank" rel="noopener">
        Watch on YouTube
      </a>
    </p>
  </main>

  <footer>motoproponent.com</footer>
</body>
</html>
