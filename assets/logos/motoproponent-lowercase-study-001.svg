</g></defs><text x="44" y="58" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="30" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.28em">motoproponent</text>
<text x="44" y="84" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">180&#176; ROTATIONAL AMBIGRAM &#8212; LOWERCASE</text>
<text x="44" y="104" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">ascenders and descenders are a rotation pair &#183; o/n solved &#183; t/e clean &#183; r/p still the sacrificial pair</text>
<text x="44" y="150" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">THE MARK &#8212; STRUCTURE ONLY</text>
<text x="44" y="168" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">one authored baseline rule; its rotation is the x-height rule, tangent to the round letters rather than cutting them</text>
<g transform="translate(44,194)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/></g>
<text x="44" y="424" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">WITH THE COLOUR CENTRE LINE</text>
<text x="44" y="442" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">at mid-height it maps onto itself, and it is already the t's crossbar and the e's crossbar &#8212; structural, not decoration</text>
<g transform="translate(44,468)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="44" y="698" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">ROTATED 180&#176;</text>
<text x="44" y="716" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the same artwork, actually rotated &#8212; identical to the row above, pixel for pixel</text>
<g transform="translate(44,742) rotate(180,942.0,85)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="44" y="972" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">WHAT IS ACTUALLY DRAWN</text>
<text x="44" y="990" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">only the left half and the pivot o are authored; the right half is this, rotated. symmetry is by construction, not by eye</text>
<g transform="translate(44,1016)"><use xlink:href="#half-diag"/></g>
<text x="44" y="1246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">HELMET STRIPE</text>
<text x="44" y="1264" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the actual brief: painted down the crown it has to read the same from either side &#8212; second band is the first one rotated</text>
<rect x="44" y="1286" width="866.64" height="134.2" fill="#1B1B1D"/>
<g transform="translate(44,1314) scale(0.46)"><use xlink:href="#half-paint"/><use xlink:href="#half-paint" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="44" y="1438.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">left side</text>
<rect x="44" y="1460.2" width="866.64" height="134.2" fill="#1B1B1D"/>
<g transform="translate(44,1488.2) scale(0.46) rotate(180,942.0,85)"><use xlink:href="#half-paint"/><use xlink:href="#half-paint" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="44" y="1612.4" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">right side &#8212; same artwork, rotated</text>
<text x="44" y="1658.4" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">SIZE TEST</text>
<text x="44" y="1676.4" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the rules are what survive longest</text>
<g transform="translate(44,1698.4) scale(0.4564755838641189)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="928" y="1746.5125265392783" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">860px wide</text>
<g transform="translate(44,1802.0008492569002) scale(0.24416135881104034)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="528" y="1827.7354564755838" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">460px wide</text>
<g transform="translate(44,1869.508280254777) scale(0.13800424628450106)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,942.0,85)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,942.0,85)"/></g>
<text x="328" y="1884.0539278131635" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">260px wide</text>
<line x1="44" y1="1948.9690021231422" x2="1928" y2="1948.9690021231422" stroke="#DCD7CF"/>
<text x="44" y="1976.9690021231422" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">NOTES</text>
<text x="44" y="1998.9690021231422" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; The metric system is the design. XH and BASE are equidistant from MID, so the x-band maps onto itself; ASC and DESC likewise, so an ascender is a descender upside down. Caps have no spare vertical real estate and that is why they lost.</text>
<text x="44" y="2018.9690021231422" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; o/n is the pair caps could not do at all. One picture, a bowl with a gap at top centre: o tolerates a gap anywhere, n requires one at the bottom.</text>
<text x="44" y="2038.9690021231422" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; t/e is the clean one. Centred stem and centred mid bar both map onto themselves, so they serve both letters at once.</text>
<text x="44" y="2058.969002123142" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; r/p is still impossible and lowercase does not help - r's arm and p's bowl both point right, and rotation flips handedness. Drawn to favour the r.</text>
<text x="44" y="2078.969002123142" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; Not legible cold, by design. Per the brief this is a glyph that resolves once you know the word.</text></svg>