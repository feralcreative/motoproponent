</g></defs><text x="44" y="58" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="30" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.28em">MOTOPROPONENT</text>
<text x="44" y="84" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">180&#176; ROTATIONAL AMBIGRAM &#8212; BUILT TO THE ORIGINAL BRIEF</text>
<text x="44" y="104" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">full-width rules top and bottom &#183; rounder bowls &#183; more air &#183; two readings of the colour centre line</text>
<text x="44" y="150" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">THE MARK &#8212; STRUCTURE ONLY</text>
<text x="44" y="168" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">device (a): one authored baseline rule, whose rotation is the top border</text>
<g transform="translate(44,194)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="394" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">COLOUR LINE &#8212; STRAIGHT</text>
<text x="44" y="412" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">mid-height throughout: first O's centre, pivot O, and the E's MIDDLE arm &#183; crosses the T at mid-stem</text>
<g transform="translate(44,438)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="638" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">COLOUR LINE &#8212; ZIGZAG</text>
<text x="44" y="656" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">rises to cap height at the T so it IS the T's top bar &#8212; which forces it to be the E's BOTTOM arm, not the middle</text>
<g transform="translate(44,682)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-zigzag"/><use xlink:href="#line-zigzag" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="882" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">ROTATED 180&#176;</text>
<text x="44" y="900" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the straight variant, actually rotated &#8212; identical to its row above, pixel for pixel</text>
<g transform="translate(44,926) rotate(180,903.0,70)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="1130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">HELMET STRIPE</text>
<text x="44" y="1148" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the actual brief: painted down the crown, it has to read the same from either side &#8212; second band is the first one rotated</text>
<rect x="44" y="1170" width="830.76" height="120.4" fill="#1B1B1D"/>
<g transform="translate(44,1198) scale(0.46)"><use xlink:href="#half-paint"/><use xlink:href="#half-paint" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="1308.4" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">left side</text>
<rect x="44" y="1330.4" width="830.76" height="120.4" fill="#1B1B1D"/>
<g transform="translate(44,1358.4) scale(0.46) rotate(180,903.0,70)"><use xlink:href="#half-paint"/><use xlink:href="#half-paint" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="44" y="1468.8000000000002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">right side &#8212; same artwork, rotated</text>
<text x="44" y="1514.8000000000002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">SIZE TEST</text>
<text x="44" y="1532.8000000000002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">the border rules are what survive longest</text>
<g transform="translate(44,1554.8000000000002) scale(0.47619047619047616)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="928" y="1596.1333333333334" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">860px wide</text>
<g transform="translate(44,1647.466666666667) scale(0.2547065337763012)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="528" y="1669.5751937984498" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">460px wide</text>
<g transform="translate(44,1709.1255813953492) scale(0.14396456256921372)"><use xlink:href="#half-final"/><use xlink:href="#half-final" transform="rotate(180,903.0,70)"/><use xlink:href="#line-straight"/><use xlink:href="#line-straight" transform="rotate(180,903.0,70)"/></g>
<text x="328" y="1721.621705426357" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">260px wide</text>
<line x1="44" y1="1785.280620155039" x2="1850" y2="1785.280620155039" stroke="#DCD7CF"/>
<text x="44" y="1813.280620155039" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#14110E" text-anchor="start" font-weight="700" letter-spacing="0.14em">NOTES</text>
<text x="44" y="1835.280620155039" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; The two colour-line variants are mutually exclusive. Positions 3 and 11 are a rotation pair, so height y at one is height 140-y at the other: cap maps to baseline, and only mid-height maps to itself.</text>
<text x="44" y="1855.280620155039" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; The straight variant is the one the structure wants. With rules top and bottom the E already has its top and bottom arms, so the only thing missing is a middle arm - which is exactly what a mid-height line supplies.</text>
<text x="44" y="1875.280620155039" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; It is also the one a helmet wants: a centre stripe is a straight line front to back.</text>
<text x="44" y="1895.280620155039" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8E8880" text-anchor="start" font-weight="400" letter-spacing="0.14em">&#8226; Not legible cold, by design. Per the brief this is a glyph that resolves once you know the word, not a wordmark.</text></svg>